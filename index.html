<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>王后模拟器</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1510; font-family: 'Montserrat', sans-serif; padding: 12px; background-image: radial-gradient(circle at 20% 30%, rgba(70,50,40,0.6) 0%, #0f0c09 100%); min-height: 100vh; }
        .game-container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255, 248, 235, 0.95); border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); border: 1px solid #e8d7b5; overflow: hidden; margin-bottom: 16px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
        @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(6, 1fr); } }
        .stat-tile { background: rgba(47, 39, 33, 0.85); backdrop-filter: blur(4px); border-radius: 20px; padding: 8px 5px; text-align: center; color: #ffefcf; font-size: 0.7rem; }
        .stat-number { font-size: 1.3rem; font-weight: 700; font-family: 'Cormorant Garamond'; line-height: 1.2; }
        .info-bar { text-align: center; background: rgba(0, 0, 0, 0.75); border-radius: 40px; padding: 8px 12px; margin-bottom: 12px; color: #ffefb9; font-weight: bold; font-size: 0.75rem; backdrop-filter: blur(4px); }
        .info-bar i { margin-right: 4px; color: #e6c384; }
        .info-bar span { margin: 0 4px; font-weight: 600; }
        @media (max-width: 600px) { .info-bar { font-size: 0.65rem; padding: 6px 8px; } }
        .tabs-container { display: flex; flex-wrap: wrap; gap: 6px; background: rgba(45, 36, 30, 0.9); padding: 8px 10px; border-radius: 40px; margin-bottom: 16px; justify-content: center; }
        .tab-btn { background: transparent; border: none; padding: 6px 14px; font-family: 'Cormorant Garamond'; font-weight: 600; color: #f8edcf; border-radius: 30px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
        .tab-btn.active { background: #c7a252; color: #241e1a; }
        .tab-pane { display: none; animation: fade 0.2s; }
        .tab-pane.active-pane { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(5px);} to { opacity: 1; transform: translateY(0);} }
        .action-sm { background: #e9dbc9; border: none; padding: 6px 12px; border-radius: 30px; font-size: 0.7rem; margin: 3px; cursor: pointer; }
        .btn-gold { background: #c7a252; border: none; padding: 8px 16px; border-radius: 40px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .flex-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        textarea, input { width: 100%; background: #fffcf5; border: 1px solid #e2cfaa; border-radius: 20px; padding: 8px 12px; font-size: 0.8rem; font-family: 'Montserrat'; }
        select { width: 100%; background: #fffcf5; border: 1px solid #e2cfaa; border-radius: 20px; padding: 8px 12px; font-size: 0.8rem; font-family: 'Montserrat'; margin-top: 5px; }
        .zone-container { margin-bottom: 12px; }
        .zone-header { background: #4a3a2e; border-radius: 20px; padding: 10px 12px; color: #f2e0bc; cursor: pointer; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .zone-header i { transition: transform 0.2s; }
        .zone-children { padding-left: 16px; display: none; margin-top: 6px; }
        .zone-children.open { display: block; }
        .location-card { background: #5a4a3a; border-radius: 16px; padding: 8px 12px; margin-top: 6px; color: #f2e0bc; cursor: pointer; font-size: 0.75rem; }
        .person-card { background: #fff7ec; border-radius: 16px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #b8865b; font-size: 0.75rem; cursor: pointer; }
        .log-area { background: #2a241f; border-radius: 20px; padding: 10px; color: #f2e1bf; max-height: 350px; overflow-y: auto; font-size: 0.7rem; }
        .event-area { background: #fef0e0; border-radius: 20px; padding: 12px; margin-top: 12px; font-size: 0.75rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: #fff8ef; border-radius: 28px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 16px; }
        .char-profile { background: #f5e8d4; border-radius: 20px; padding: 12px; margin-bottom: 12px; }
        .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .stat-badge { background: #c7a25230; padding: 4px 10px; border-radius: 30px; font-size: 0.65rem; }
        .loading-text { color: #e6c384; font-style: italic; }
        .error-text { color: #f5a97f; }
        select { background-color: #fffcf5; }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .stat-tile { padding: 5px; font-size: 0.6rem; }
            .stat-number { font-size: 1.1rem; }
            .tab-btn { padding: 4px 10px; font-size: 0.7rem; }
            .action-sm { padding: 4px 10px; font-size: 0.65rem; }
            .zone-header { padding: 8px 10px; font-size: 0.8rem; }
            .location-card { padding: 6px 10px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div style="text-align:center; margin-bottom:12px;">
        <h1 style="font-family:'Cormorant Garamond'; color:#f7e5c2; font-size:1.5rem;">⚜️ 埃瑟兰秘宫 ⚜️</h1>
        <p style="color:#dbbc8c; font-size:0.7rem;">王后模拟器</p>
    </div>

    <div id="creatorSection" class="glass-card" style="padding:16px; margin-bottom:16px;">
        <div style="height:3px; background:#c7a55b; width:100%; margin-bottom:12px;"></div>
        <h3 style="font-size:1rem;"><i class="fas fa-crown"></i> 自定身份</h3>
        <textarea id="appearanceInput" rows="2" placeholder="形象：银白长发，紫罗兰眼眸，冷艳孤傲（请填入外貌）"></textarea>
        <textarea id="identityInput" rows="2" placeholder="背景：北境遗族公主，和亲埃瑟兰，精通占星与毒药，性格阴狠。（请填入背景与性格等特征）"></textarea>
        <button id="confirmIdentityBtn" class="btn-gold" style="width:100%; margin-top:8px;">加冕 · 开启纪元</button>
    </div>

    <div id="gameMainPanel" style="display:none;">
        <div class="stat-grid">
            <div class="stat-tile">👑 声望<div class="stat-number" id="statPrestige">50</div></div>
            <div class="stat-tile">🗡️ 密谋<div class="stat-number" id="statIntrigue">30</div></div>
            <div class="stat-tile">💰 金币<div class="stat-number" id="statGold">200</div></div>
            <div class="stat-tile">💋 情人<div class="stat-number" id="statLovers">0</div></div>
            <div class="stat-tile">⭐ 心腹<div class="stat-number" id="statConfidants">0</div></div>
            <div class="stat-tile">⚰️ 状态<div class="stat-number" id="gameState">自由</div></div>
        </div>
        <div class="info-bar">
            <i class="fas fa-clock"></i> <span id="fullDate">埃瑟兰历元年 春 1月 1日</span> |
            <i class="fas fa-map-marker-alt"></i> <span id="currentLocationDisplay">皇宫·寝宫</span> |
            <i class="fas fa-coins"></i> 国库: <span id="treasury">100000</span> |
            <i class="fas fa-heart"></i> 国王爱意: <span id="kingAffection">60</span> |
            <i class="fas fa-eye"></i> 国王怀疑: <span id="kingSuspicion">30</span>
        </div>
        <div class="tabs-container">
            <button class="tab-btn active" data-tab="tabExplore">🗺️ 巡游</button>
            <button class="tab-btn" data-tab="tabCharacters">👥 人物志</button>
            <button class="tab-btn" data-tab="tabLovers">💕 情人</button>
            <button class="tab-btn" data-tab="tabConfidants">⭐ 心腹培养</button>
            <button class="tab-btn" data-tab="tabNote">📓 笔记</button>
            <button class="tab-btn" data-tab="tabStory">📖 剧情记忆</button>
            <button class="tab-btn" data-tab="tabAPI">🔌 AI配置</button>
            <button class="tab-btn" data-tab="tabArchive">💾 存档</button>
        </div>

        <div id="tabExplore" class="tab-pane active-pane">
            <div class="glass-card" style="padding:12px;">
                <h4 style="font-size:0.9rem;">🗺️ 埃瑟兰大陆（点击区域展开/折叠）</h4>
                <div id="locationsTree"></div>
                <div id="locationDetailPanel" class="event-area" style="margin-top:12px;">
                    <div id="locationDetailText">点击地点查看详情</div>
                    <div id="locationPeopleList" class="flex-btns"></div>
                </div>
                <div style="margin-top:12px;">
                    <input type="text" id="freeActionInput" placeholder="✨ 自由行动（AI叙事）">
                    <div class="flex-btns">
                        <button id="submitFreeAction" class="action-sm" style="flex:2;">🌙 执行</button>
                        <button id="randomEventBtn" class="action-sm" style="flex:1;">🎲 随机事件</button>
                        <button id="sleepBtn" class="action-sm" style="flex:1;">😴 睡觉</button>
                    </div>
                </div>
                <div id="freeActionResult" class="event-area" style="display:none;"></div>
                <div id="prisonActions" class="event-area" style="display:none; background:#4a2a2a;"></div>
                <div id="ghostActions" class="event-area" style="display:none; background:#2a2a4a;"></div>
            </div>
        </div>

        <div id="tabCharacters" class="tab-pane"><div class="glass-card" style="padding:12px;"><h4>👥 所有人物</h4><div id="allCharactersList" style="max-height:400px; overflow-y:auto;"></div></div></div>
        <div id="tabLovers" class="tab-pane"><div class="glass-card" style="padding:12px;"><h4>💕 秘密情人</h4><div id="loversList" style="max-height:400px;"></div><button id="dismissAllLoversBtn" class="action-sm" style="margin-top:8px;">遣散所有情人</button></div></div>
        <div id="tabConfidants" class="tab-pane"><div class="glass-card" style="padding:12px;"><h4>⭐ 心腹培养 & 官职提拔</h4><div id="confidantsList" style="max-height:400px;"></div></div></div>
        <div id="tabNote" class="tab-pane"><div class="glass-card" style="padding:12px;"><h4>📓 私人笔记</h4><textarea id="privateNote" rows="6"></textarea><button id="saveNoteBtn" class="action-sm" style="margin-top:8px;">保存笔记</button></div></div>
        <div id="tabStory" class="tab-pane"><div class="glass-card" style="padding:12px;"><h4>📖 剧情记忆</h4><div id="storyContainer" class="log-area" style="height:350px;"></div><button id="summarizeStoryBtn" class="action-sm" style="margin-top:8px;">总结摘要</button></div></div>

        <div id="tabAPI" class="tab-pane">
            <div class="glass-card" style="padding:12px;">
                <h4 style="font-size:0.9rem;">🔌 AI接口配置</h4>
                <input type="text" id="apiUrl" placeholder="API端点" value="https://api.openai.com/v1/chat/completions">
                <input type="password" id="apiKey" placeholder="API Key">
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <input type="text" id="modelName" placeholder="模型名称" style="flex:2;" value="gpt-3.5-turbo">
                    <button id="fetchModelsBtn" class="action-sm" style="flex:1;">📋 获取模型列表</button>
                </div>
                <select id="modelSelect" style="display:none; margin-top: 8px;"></select>
                <textarea id="promptTemplate" rows="8" style="margin-top:8px;"></textarea>
                <div class="flex-btns" style="margin-top:8px;">
                    <button id="saveApiConfigBtn" class="btn-gold">💾 保存配置</button>
                    <button id="testApiBtn" class="action-sm">🔌 测试连接</button>
                    <button id="resetDefaultPromptBtn" class="action-sm">🔄 恢复默认模板</button>
                </div>
                <div id="apiTestResult" class="event-area" style="margin-top:12px; display:none;"></div>
            </div>
        </div>

        <div id="tabArchive" class="tab-pane"><div class="glass-card" style="padding:12px;"><h4>💾 导出/导入存档</h4>
            <button id="exportSaveBtn" class="btn-gold">📤 导出存档</button>
            <button id="importSaveBtn" class="action-sm" style="margin-left:8px;">📂 导入存档</button>
            <button id="resetBtn" class="action-sm" style="margin-left:8px;">🔄 轮回重置</button>
            <input type="file" id="importFileInput" style="display:none;" accept=".json">
            <div class="hint-text" style="margin-top:8px;">导出当前进度为 .json 文件；导入时请选择之前导出的存档。</div>
        </div></div>
    </div>
</div>

<div id="charModal" class="modal"><div class="modal-content" id="charModalContent"></div></div>
<div id="autonomousEventModal" class="modal" style="display:none;">
    <div class="modal-content" id="autonomousEventContent">
        <div id="autonomousEventText" style="white-space:pre-wrap; margin-bottom:12px;"></div>
        <div class="flex-btns">
            <button id="confirmAutonomousBtn" class="action-sm">✅ 确定</button>
            <button id="continueAutonomousBtn" class="action-sm">▶️ 继续</button>
            <button id="regenerateAutonomousBtn" class="action-sm">🔄 重新生成</button>
            <button id="cancelAutonomousBtn" class="action-sm">❌ 取消</button>
        </div>
    </div>
</div>
<!-- 新增：人物交互专用弹窗 -->
<div id="interactionModal" class="modal" style="display:none;">
    <div class="modal-content" id="interactionModalContent">
        <div id="interactionText" style="white-space:pre-wrap; margin-bottom:12px;"></div>
        <div class="flex-btns">
            <button id="confirmInteractionBtn" class="action-sm">✅ 确定</button>
            <button id="continueInteractionBtn" class="action-sm">▶️ 继续</button>
            <button id="regenerateInteractionBtn" class="action-sm">🔄 重新生成</button>
            <button id="cancelInteractionBtn" class="action-sm">❌ 取消</button>
        </div>
    </div>
</div>

<script>
// ==================== 特殊人物背景 ====================
const SPECIAL_CHARACTER_BACKGROUNDS = {
    "理查德": "国王，自幼丧母，在残酷的宫廷斗争中从兄弟姐妹中一路杀到王位，性格果决冷酷，不轻易信任他人。他重视力量与忠诚，对皇后既有政治联姻的责任感，也有微妙的情感。",
    "雷奥纳多": "将军，出身贵族，比国王大五岁，自幼与国王相识，是国王最信任的童年伙伴。常年征战在外，如今边境安定才返回宫廷继续效力。他忠诚、沉稳，但常年征战使他身上带着沙场的冷峻。",
    "塞西莉亚": "侍女长，曾是王太后的贴身侍女，知道太多宫廷秘密。她有一个私生子被秘密送出宫廷，这是她最大的软肋。她谨慎圆滑，善于在各方势力间周旋。",
    "洛伦佐": "书记官，实际上是邻国派来的间谍，但他逐渐被皇后的魅力所吸引，内心充满矛盾。他文弱浪漫，热爱诗歌，但也身负秘密使命。",
    "伊莎贝拉": "修女，真实身份是被流放的贵族之女，因家族变故躲入教堂避祸。她表面虔诚禁欲，实则对宫廷爱恨交织。"
};

// ==================== 提示词模板 ====================
const PLAYER_ACTION_PROMPT = `你是史诗宫廷小说的叙事者，文风华丽细腻，擅长心理描写与权谋博弈。你必须严格遵循以下指令，不得遗漏任何标记。

【皇后】形象: {{appearance}} 背景: {{identity}} 性格: 冷艳、隐忍、狡黠、深藏野心。
【特殊人物背景】（请严格遵循，不可OOC）{{specialBackgrounds}}
【当前状态】声望: {{prestige}} 密谋: {{intrigue}} 金币: {{gold}} 国王爱意: {{kingAffection}} 国王怀疑: {{kingSuspicion}}
【时间地点】时间: {{fullDate}} 地点: {{location}}
【近期剧情记忆】{{storyMemories}}
【当前人物关系】{{characterRelations}}
【皇后的行动】「{{intent}}」

【创作要求】
1. 生成至少1000字的叙事，细致描写环境、心理、微表情和权力暗流。
2. 严格遵循特殊人物背景，不可扭曲其性格与经历。
3. 若出现新角色，必须在文末添加标记：【新角色:名字,身份,性格,区域,具体地点,是否允许多元爱情(是/否)】。例如：【新角色:艾莉诺,女官,温柔,皇宫,花园,否】
4. 若出现新地点，必须在文末添加标记：【新地点:地点名,所属区域,描述】。例如：【新地点:玫瑰回廊,皇宫,一条布满荆棘与玫瑰的隐秘长廊】
5. 必须在文末添加【数值变动:声望±X,密谋±X,金币±X,国王爱意±X,国王怀疑±X】（每次变动绝对值≤5）。
6. 必须添加【剧情记忆:一句话摘要】。
7. 若人物关系发生变化，添加【关系变化:角色名,新关系】（新关系必须为lover/enemy/acquaintance之一）。
8. 若任一角色的好感或忠诚等属性发生变化，必须添加【角色数值:角色名,好感±X,忠诚±Y】（可只写变化的属性）。若无变化则省略。例如：【角色数值:洛伦佐,好感+5】。
9. 以上所有标记必须出现在叙事末尾，且严格按照格式，不得缺少方括号和中文名称。`;

const AUTONOMOUS_EVENT_PROMPT = `你是史诗宫廷小说的叙事者，文风细腻。根据以下设定生成300-600字的叙事，聚焦角色间的自主互动。你必须严格遵循以下指令。

【背景】{{eventContext}}
【涉及人物】{{characters}}
【特殊人物背景】（请参考，不得OOC）{{specialBackgrounds}}
【当前宫廷状态】声望: {{prestige}} 密谋: {{intrigue}} 国王爱意: {{kingAffection}} 国王怀疑: {{kingSuspicion}}
【时间】{{fullDate}}

【要求】
1. 生成叙事，展现角色性格和关系冲突。
2. 严格遵循特殊人物背景设定。
3. 若出现新地点，必须在文末添加标记：【新地点:地点名,所属区域,描述】。
4. 必须在文末添加【数值变动:声望±X,密谋±X,金币±X,国王爱意±X,国王怀疑±X】（每次变动绝对值≤5）。
5. 必须添加【剧情记忆:一句话摘要】。
6. 若人物关系发生变化，添加【关系变化:角色名,新关系】（新关系必须为lover/enemy/acquaintance之一）。
7. 若任一角色的好感或忠诚发生变化，必须添加【角色数值:角色名,好感±X,忠诚±Y】。若无变化则省略。例如：【角色数值:雷奥纳多,好感-3】。
8. 以上所有标记必须出现在叙事末尾，严格按照格式书写。`;

// 新增：人物交互专用提示词模板
const INTERACTION_PROMPT = `你是史诗宫廷小说的叙事者，文风细腻。根据以下设定生成500字左右的叙事，聚焦皇后与目标人物的直接互动。必须严格遵循以下指令。

【皇后】形象: {{appearance}} 背景: {{identity}}
【目标人物】{{targetName}} ({{targetType}})，好感{{targetAffection}}，忠诚{{targetLoyalty}}，当前关系{{targetRelation}}
【特殊人物背景】（请参考，不得OOC）{{specialBackgrounds}}
【互动动作】皇后对{{targetName}}执行了「{{actionType}}」。
【当前状态】声望: {{prestige}} 密谋: {{intrigue}} 金币: {{gold}} 国王爱意: {{kingAffection}} 国王怀疑: {{kingSuspicion}}
【时间地点】{{fullDate}} · {{location}}

【要求】
1. 生成500字左右的具体叙事，详细描写皇后的举动、对方的反应、周边环境及心理活动。
2. 叙事必须紧扣「{{actionType}}」这一动作，不得偏离主题。

function getSpecialBackgroundsString(){
    let sb = "";
    for(let [name, bg] of Object.entries(SPECIAL_CHARACTER_BACKGROUNDS)){

function getFullDate(){
    let seasons=["春","夏","秋","冬"];
    return `埃瑟兰历 ${game.year}年 ${seasons[game.seasonIndex]} ${game.month}月 ${game.day}日`;
}
function advanceDay(extraDays=1){
    for(let i=0;i<extraDays;i++){
        game.day++;
        let monthDays=[31,28,31,30,31,30,31,31,30,31,30,31];
        if(game.day > monthDays[game.month-1]){
            game.day=1;
            game.month++;
            if(game.month>12){
                game.month=1;
                game.seasonIndex=(game.seasonIndex+1)%4;
                game.year++;
            }
            applyMonthlySalary();
        }
    }
    updateDateDisplay();
    if(game.gameState==="free" && !game.inExile && game.prestige < -100){
        if(game.negativePrestigeStartYear===null) game.negativePrestigeStartYear=game.year;
        if(game.year - game.negativePrestigeStartYear >= 1 && game.king.affection < 70){
            game.gameState="prison";
            game.currentZone="皇宫"; game.currentLocation="dungeon";
            showResultMessage("⚔️ 声望过低且国王爱意不足，你被打入大牢！", true);
            renderLocations(); updateLocationDisplay();
        }
    } else if(game.prestige >= -100) {
        game.negativePrestigeStartYear=null;
    }
    if(game.gameState==="prison" && game.prestige <= -100 && game.king.affection < 20 && game.escapeAttempts >= 3){
        game.gameState="dead";
        showResultMessage("💀 国王下令处死！你已死亡。", true);
        if(confirm("化为幽灵继续游荡？")){ game.gameState="ghost"; showResultMessage("👻 你化为怨灵", true); }
        else resetGame();
        updateUI();
    }
    if(game.inExile){
        let monthsPassed = (game.year - game.exileStartYear)*12 + (game.month - game.exileStartMonth);
        if(monthsPassed >= 12){
            game.inExile=false;
            game.gameState="free";
            game.currentZone="皇宫"; game.currentLocation="bedroom";
            showResultMessage("🏛️ 修行期满，你从神殿返回皇宫。", true);
            renderLocations(); updateLocationDisplay();
        }
    }
}
function applyMonthlySalary(){
    game.gold += 5000;
    showResultMessage(`💰 月初结算：皇后获得月薪5000金币，现有金币 ${game.gold}`, false);
    let totalPaid = 0;
    for(let c of characters){
        if(c.salary>0 && !c.inPrison){
            let pay = c.salary;
            if(c.isConfidant) pay = Math.floor(pay * 1.5);
            c.wealth += pay;
            totalPaid += pay;
        }
    }
    game.treasury -= totalPaid;
    if(game.treasury < 0) game.treasury = 0;
    document.getElementById('treasury').innerText = game.treasury;
}

function renderLocations(){
    let ctn=document.getElementById('locationsTree'); if(!ctn) return;
    ctn.innerHTML='';
    for(let zone of zones){
        let zoneDiv=document.createElement('div');
        zoneDiv.className="zone-container";
        let header=document.createElement('div');
        header.className="zone-header";
        header.innerHTML=`<span>🏰 ${zone.name}</span><i class="fas fa-chevron-down"></i>`;
        let childrenDiv=document.createElement('div');
        childrenDiv.className="zone-children";
        for(let loc of zone.children){
            let locDiv=document.createElement('div');
            locDiv.className="location-card";
            locDiv.innerHTML=`📍 ${loc.name}`;
            locDiv.onclick=(e)=>{
                e.stopPropagation();
                if(game.gameState==="free" && !game.inExile){
                    game.currentZone=zone.name;
                    game.currentLocation=loc.id;
                    updateLocationDisplay();
                    updateLocationDetail();
                } else alert("无法移动");
            };
            childrenDiv.appendChild(locDiv);
        }
        header.onclick=()=>{
            childrenDiv.classList.toggle('open');
            let icon=header.querySelector('i');
            icon.style.transform=childrenDiv.classList.contains('open')?'rotate(180deg)':'rotate(0deg)';
        };
        zoneDiv.appendChild(header);
        zoneDiv.appendChild(childrenDiv);
        ctn.appendChild(zoneDiv);
    }
}
function updateLocationDisplay(){
    let zone=zones.find(z=>z.name===game.currentZone);
    let loc=zone?.children.find(c=>c.id===game.currentLocation);
    let locName=loc?loc.name:game.currentLocation;
    document.getElementById('currentLocationDisplay').innerText=`${game.currentZone}·${locName}`;
}
function updateLocationDetail(){
    let zone=zones.find(z=>z.name===game.currentZone);
    let loc=zone?.children.find(c=>c.id===game.currentLocation);
    if(!loc) return;
    let people=characters.filter(c=>c.zone===game.currentZone && c.location===game.currentLocation && !c.inPrison);
    let html=people.map(p=>`<button class="action-sm" onclick="showPersonModal(${p.id})">${p.name} (${p.type})</button>`).join('');
    document.getElementById('locationDetailText').innerHTML=`<strong>${loc.name}</strong><br>${loc.desc}`;
    document.getElementById('locationPeopleList').innerHTML=html||"<span>无人</span>";
}

async function testAPIConnection() {
    let resultDiv = document.getElementById('apiTestResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div class="loading-text">⏳ 测试中，请稍候...</div>';
    let url = document.getElementById('apiUrl').value;
    let key = document.getElementById('apiKey').value;
    let model = document.getElementById('modelName').value;
    if (!url) {
        resultDiv.innerHTML = '<div class="error-text">❌ 未填写API端点</div>';
        return;
    }
    try {
        let response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...(key ? { 'Authorization': `Bearer ${key}` } : {})
            },
            body: JSON.stringify({
                model: model,
                messages: [{ role: 'user', content: '你好，请回复“连接成功”四个字，不要有其他内容。' }],
                max_tokens: 20,
                temperature: 0
            })
        });
        if (!response.ok) {
            let errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 100)}`);
        }
        let data = await response.json();
        let reply = data.choices?.[0]?.message?.content;
        if (reply && reply.includes('连接成功')) {
            resultDiv.innerHTML = `<div style="color: #6b8c42;">✅ API连接成功！返回内容：${reply}</div>`;
        } else {
            resultDiv.innerHTML = `<div style="color: #e6c384;">⚠️ API有响应，但返回内容异常：${reply || '空'}</div>`;
        }
    } catch (err) {
        resultDiv.innerHTML = `<div class="error-text">❌ 连接失败：${err.message}</div>`;
    }
}

async function fetchModels() {
    let resultDiv = document.getElementById('apiTestResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div class="loading-text">⏳ 正在获取模型列表...</div>';
    let url = document.getElementById('apiUrl').value;
    let key = document.getElementById('apiKey').value;
    if (!url) {
        resultDiv.innerHTML = '<div class="error-text">❌ 未填写API端点</div>';
        return;
    }
    let modelsUrl = url;
    if (modelsUrl.endsWith('/chat/completions')) {
        modelsUrl = modelsUrl.slice(0, -'/chat/completions'.length) + '/models';
    } else {
        modelsUrl = modelsUrl.replace(/\/$/, '') + '/models';
    }
    try {
        let response = await fetch(modelsUrl, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                ...(key ? { 'Authorization': `Bearer ${key}` } : {})
            }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let data = await response.json();
        let models = data.data || data.models || [];
        if (!models.length) throw new Error('未获取到模型列表');
        let modelSelect = document.getElementById('modelSelect');
        modelSelect.innerHTML = '<option value="">-- 选择模型 --</option>';
        models.forEach(m => {
            let id = (typeof m === 'string') ? m : (m.id || m);
            modelSelect.innerHTML += `<option value="${id}">${id}</option>`;
        });
        modelSelect.style.display = 'block';
        modelSelect.onchange = () => {
            if (modelSelect.value) {
                document.getElementById('modelName').value = modelSelect.value;
            }
        };
        resultDiv.innerHTML = `<div style="color: #6b8c42;">✅ 已获取 ${models.length} 个模型，请从下拉框中选择或手动输入。</div>`;
    } catch (err) {
        resultDiv.innerHTML = `<div class="error-text">❌ 获取模型列表失败：${err.message}。请手动输入模型名称。</div>`;
        console.error(err);
    }
}

function buildPrompt(intent, isPlayerAction=true, eventContext="", involvedChars=[]){
    let tpl = isPlayerAction ? apiConfig.promptTemplate : AUTONOMOUS_EVENT_PROMPT;
    let mem=storyMemories.slice(-8).map((m,i)=>`[${i+1}] ${m.summary}`).join("\n")||"无";
    let rel=characters.filter(c=>c.name!=="理查德").map(c=>`${c.name}:好感${c.affection},忠诚${c.loyalty},关系${c.relationship}`).join("\n");
    let specialBGs = getSpecialBackgroundsString();
    let base = {
        appearance: game.appearance||"皇后",
        identity: game.identity||"贵女",
        prestige: game.prestige,
        intrigue: game.intrigue,
        gold: game.gold,
        kingAffection: game.king.affection,
        kingSuspicion: game.king.suspicion,
        fullDate: getFullDate(),
        location: `${game.currentZone}·${game.currentLocation}`,
        storyMemories: mem,
        characterRelations: rel,
        specialBackgrounds: specialBGs,
        intent: intent
    };
    if(!isPlayerAction){
        base.eventContext = eventContext;
        base.characters = involvedChars.map(c=>`${c.name}(${c.type},好感${c.affection})`).join(", ");
    }
    let result = tpl;
    for(let [k,v] of Object.entries(base)) result = result.replace(new RegExp(`\\{\\{${k}\\}\\}`, 'g'), v);
    return result;
}

function parseAIResponse(novel){
    let delta={prestige:0,intrigue:0,gold:0,kingAffection:0,kingSuspicion:0},newChars=[],newLocs=[],mem="",relationChanges=[], charDeltas=[];
    let vm=novel.match(/【数值变动:([^】]+)】/);
    if(vm){
        let parts=vm[1].match(/(声望|密谋|金币|国王爱意|国王怀疑)([+\-]\d+)/g);
        if(parts)parts.forEach(p=>{
            let m=p.match(/(声望|密谋|金币|国王爱意|国王怀疑)([+\-]\d+)/);
            if(m){
                let key=m[1], rawVal=parseInt(m[2]);
                let val = Math.min(5, Math.max(-5, rawVal));
                if(key==='声望') delta.prestige=val;
                if(key==='密谋') delta.intrigue=val;
                if(key==='金币') delta.gold=val;
                if(key==='国王爱意') delta.kingAffection=val;
                if(key==='国王怀疑') delta.kingSuspicion=val;
            }
        });
    }
    let cm=novel.match(/【新角色:([^】]+)】/g);
    if(cm)cm.forEach(c=>{
        let parts=c.replace(/【新角色:|】/g,'').split(',');
        if(parts.length>=2){
            let name=parts[0].trim();
            let type=parts[1].trim();
            let desc=parts[2]?.trim()||"新面孔";
            let zone=parts[3]?.trim()||"皇宫";
            let location=parts[4]?.trim()||"花园";
            let polyamorous=false;
            if(parts.length>=6){
                let polyVal=parts[5].trim().toLowerCase();
                polyamorous=(polyVal==="true" || polyVal==="是" || polyVal==="1");
            }
            newChars.push({name, type, zone, location, desc, polyamorous});
        }
    });
    let lm=novel.match(/【新地点:([^】]+)】/g);if(lm)lm.forEach(l=>{let parts=l.replace(/【新地点:|】/g,'').split(',');if(parts.length>=3)newLocs.push({zone:parts[1].trim(),id:parts[0].trim().toLowerCase().replace(/\s/g,''),name:parts[0].trim(),desc:parts[2]?.trim()||"新地点"});});
    let mm=novel.match(/【剧情记忆:([^】]+)】/);if(mm)mem=mm[1].trim();
    let rcm=novel.match(/【关系变化:([^】]+)】/g);if(rcm)rcm.forEach(rc=>{let parts=rc.replace(/【关系变化:|】/g,'').split(',');if(parts.length>=2)relationChanges.push({name:parts[0].trim(),newRel:parts[1].trim()});});
    let cdm = novel.match(/【角色数值:([^】]+)】/g);
    if(cdm){
        cdm.forEach(cd => {
            let content = cd.replace(/【角色数值:|】/g, '').trim();
            let parts = content.split(',').map(p => p.trim());
            if(parts.length >= 2){
                let name = parts[0];
                let obj = {};
                for(let i=1; i<parts.length; i++){
                    let match = parts[i].match(/^(好感|忠诚)([+\-]\d+)$/);
                    if(match){
                        obj[match[1]] = parseInt(match[2]);
                    }
                }
                if(Object.keys(obj).length > 0){
                    charDeltas.push({ name, ...obj });
                }
            }
        });
    }
    return {delta,newChars,newLocs,memory:mem,cleaned:novel,relationChanges, charDeltas};
}
async function callAI(promptText){
    if(!apiConfig.url) throw new Error("未配置API地址");
    let headers={"Content-Type":"application/json"};
    if(apiConfig.key) headers["Authorization"] = `Bearer ${apiConfig.key}`;
    let res = await fetch(apiConfig.url, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
            model: apiConfig.model,
            messages: [{ role: "user", content: promptText }],
            temperature: 0.85,
            max_tokens: 2000
        })
    });
    if(!res.ok){
        let errorMsg = `API错误: ${res.status}`;
        try{
            let errData = await res.json();
            errorMsg = errData.error?.message || errorMsg;
        }catch(e){}
        throw new Error(errorMsg);
    }
    let data = await res.json();
    let novel = data.choices?.[0]?.message?.content;
    if(!novel) throw new Error("AI未返回有效内容");
    return parseAIResponse(novel);
}
async function fallbackAI(promptText){
    await new Promise(r => setTimeout(r, 300));
    let novel = `模拟叙事: ${promptText.substring(0,100)}...\n【数值变动:声望+2,密谋+1】\n【剧情记忆:离线模拟事件】`;
    return parseAIResponse(novel);
}
async function generateEventPreview(promptText, isAutonomous=false){
    let res = null;
    try{
        res = await callAI(promptText);
    }catch(e){
        console.warn("API失败，使用离线模拟", e);
        showResultMessage(`⚠️ AI调用失败: ${e.message}，已切换至离线模拟模式`, true);
        res = await fallbackAI(promptText);
    }
    return res;
}
async function generateEvent(promptText, isAutonomous=false){
    let res = await generateEventPreview(promptText, isAutonomous);
    applyDelta(res.delta);
    for(let c of res.newChars) addNewCharacter(c);
    for(let l of res.newLocs) addNewLocation(l);
    for(let rc of res.relationChanges) applyRelationChange(rc.name, rc.newRel);
    applyCharDeltas(res.charDeltas);
    if(res.memory) storyMemories.unshift({time:getFullDate(),location:`${game.currentZone}·${game.currentLocation}`,intent:isAutonomous?"自主事件":"自由行动",content:res.cleaned,summary:res.memory});
    if(storyMemories.length>40) storyMemories.pop();
    return res;
}
function applyDelta(delta){
    game.prestige = Math.min(100, Math.max(-200, game.prestige + (delta.prestige||0)));
    game.intrigue = Math.min(100, Math.max(0, game.intrigue + (delta.intrigue||0)));
    game.gold = Math.max(0, game.gold + (delta.gold||0));
    game.king.affection = Math.min(100, Math.max(0, game.king.affection + (delta.kingAffection||0)));
    game.king.suspicion = Math.min(100, Math.max(0, game.king.suspicion + (delta.kingSuspicion||0)));
}
function addNewCharacter(c){
    if(!characters.some(ch=>ch.name===c.name)){
        characters.push({
            id:nextId++, name:c.name, type:c.type, zone:c.zone||"皇宫", location:c.location||"花园",
            affection:50, loyalty:50, relationship:"acquaintance", isLover:false, isConfidant:false,
            personality:"神秘", loveStyle:"未知", desc:c.desc,
            combat:30, intelligence:50, diplomacy:50, canBeConfidant:true,
            rankIdx:0, wealth:50, salary:rankTree[0].salary,
            married:false, polyamorous: c.polyamorous===true, inPrison:false
        });
    }
}
function addNewLocation(l){
    let zoneObj = zones.find(z=>z.name===l.zone);
    if(zoneObj && !zoneObj.children.some(cl=>cl.id===l.id)){
        zoneObj.children.push({id:l.id, name:l.name, desc:l.desc});
        renderLocations();
    }
}
function applyRelationChange(name, newRel){
    let ch = characters.find(c=>c.name===name);
    if(ch){
        let oldRel = ch.relationship;
        ch.relationship = newRel;
        if(newRel === "lover"){
            ch.isLover = true;
        } else if(newRel === "enemy"){
            ch.isLover = false;
        } else if(newRel === "acquaintance"){
            ch.isLover = false;
        }
    }
}
function applyCharDeltas(charDeltas){
    if(!charDeltas) return;
    charDeltas.forEach(cd => {
        let c = characters.find(c=>c.name === cd.name);
        if(c){
            if(cd.好感 !== undefined) c.affection = Math.min(100, Math.max(0, c.affection + cd.好感));
            if(cd.忠诚 !== undefined) c.loyalty = Math.min(100, Math.max(0, c.loyalty + cd.忠诚));
        }
    });
}

function canPromote(c){
    if(c.rankIdx<0 || c.rankIdx>=rankTree.length-1) return false;
    let n = rankTree[c.rankIdx+1];
    return c.combat>=n.reqCombat && c.intelligence>=n.reqIntel && c.diplomacy>=n.reqDipl && c.loyalty>=n.reqLoyalty;
}
function promoteRank(c){
    if(!canPromote(c)){
        showResultMessage(`${c.name} 条件不足，无法晋升。`, true);
        return false;
    }
    c.rankIdx++;
    let r = rankTree[c.rankIdx];
    c.salary = r.salary;
    showResultMessage(`${c.name} 成功晋升为 ${r.name}！月薪 ${r.salary} 金。`, false);
    return true;
}
function trainAttributeDeep(c, attr, costGold, days, gain, description){
    if(game.gold < costGold){
        showResultMessage(`金币不足，需要 ${costGold} 金`, true);
        return false;
    }
    if(!confirm(`${description}\n需要 ${costGold} 金币，耗时 ${days} 天。确定执行吗？`)) return false;
    game.gold -= costGold;
    advanceDay(days);
    c[attr] = Math.min(100, (c[attr]||0) + gain);
    showResultMessage(`🎓 培养完成！${c.name} 的 ${attr==='combat'?'武艺':(attr==='intelligence'?'智谋':'外交')} +${gain}，花费 ${costGold} 金，经过 ${days} 天。`, false);
    updateUI();
    autoSave();
    return true;
}

1- 武艺训练：1500金，边境军营锻炼5天，武艺+3
2- 智谋修习：1800金，藏书塔研读7天，智谋+3
3- 外交历练：2000金，出使邻国10天，外交+3`);
    if(choice === "1") trainAttributeDeep(c, 'combat', 1500, 5, 3, "派往边境军营，跟随骑士团训练武艺。");
    else if(choice === "2") trainAttributeDeep(c, 'intelligence', 1800, 7, 3, "进入藏书塔，研读古代谋略典籍。");

    let relationBadge = c.relationship==="lover"?"💕情人":c.relationship==="enemy"?"⚠️仇敌":"🤝结识";
    let extraButtons = (c.relationship === "lover") ? `<button id="breakUpBtn" class="action-sm">💔 分手</button>` : '';

    let forceNightButton = (!c.isLover) ? '<button id="forceNightBtn" class="action-sm">⚠️ 强行要求</button>' : '';
    let spendNightButton = (!c.isLover && !c.married && c.affection>=60) ? '<button id="spendNightBtn" class="action-sm">🌙 共度良宵</button>' : '';

    content.innerHTML = `
        <div class="char-profile">
            <h3>${c.name} <span style="font-size:0.7rem">(${c.type})</span> <span class="stat-badge">${relationBadge}</span></h3>
            <div class="stat-row">${attrs}</div>
            <div>🎭 ${c.personality} | 💕 ${c.loveStyle}</div>
            <div>📍 ${c.zone}·${c.location} | ${isKing ? "👑 国王" : `💰月俸:${c.salary}金`}</div>
            <div>${c.desc}</div>
            ${c.isLover?'<div>💕 情人关系</div>':''}${c.isConfidant?'<div>⭐ 心腹</div>':''}
        </div>
        <div>
            <input type="text" id="personActionInput" placeholder="对${c.name}的自由行动（AI叙事）" style="font-size:0.7rem; margin-bottom:0.3rem">
            <div class="flex-btns">
                <button id="personActionBtn" class="action-sm">💬 自由行动</button>
                <button id="personRandomBtn" class="action-sm">🎲 随机事件</button>
                <button id="requestMoneyBtn" class="action-sm">💰 索要金钱</button>
                ${spendNightButton}
                ${forceNightButton}
                ${!isKing && !c.isConfidant && c.canBeConfidant!==false ? '<button id="makeConfidantBtn" class="action-sm">⭐ 提拔心腹</button>' : ''}
                ${!isKing && c.isConfidant ? '<button id="trainBtn" class="action-sm">📈 深度培养</button>' : ''}
                ${!isKing && canPromote(c) ? '<button id="promoteBtn" class="action-sm">🏆 晋升官职</button>' : ''}
                ${extraButtons}
                <button class="action-sm" onclick="closeModal()">关闭</button>
            </div>
        </div>
        <div id="personResult" class="event-area" style="display:none; margin-top:0.5rem"></div>
    `;
    modal.style.display='flex';
    document.getElementById('personActionBtn').onclick = ()=>{
        let intent = document.getElementById('personActionInput').value;
        if(intent){ closeModal(); performAction(`对${c.name}: ${intent}`); }
    };
    document.getElementById('personRandomBtn').onclick = ()=>{
        closeModal(); performAction(`基于当前局势与${c.name}发生随机事件`);
    };
    document.getElementById('requestMoneyBtn').onclick = ()=>{ requestMoney(c); closeModal(); };
    if(document.getElementById('spendNightBtn')) document.getElementById('spendNightBtn').onclick = ()=>{ spendNight(c); closeModal(); };
    if(document.getElementById('forceNightBtn')) document.getElementById('forceNightBtn').onclick = ()=>{ forceNight(c); closeModal(); };
    if(document.getElementById('makeConfidantBtn')) document.getElementById('makeConfidantBtn').onclick = ()=>{ makeConfidant(c); closeModal(); };
    if(document.getElementById('trainBtn')) document.getElementById('trainBtn').onclick = ()=>{ showTrainDialog(c); closeModal(); };
    if(document.getElementById('promoteBtn')) document.getElementById('promoteBtn').onclick = ()=>{ if(promoteRank(c)) updateUI(); closeModal(); };
    if(document.getElementById('breakUpBtn')) document.getElementById('breakUpBtn').onclick = ()=>{ breakUpWithLover(c); closeModal(); };
}
function closeModal(){ document.getElementById('charModal').style.display='none'; }

// ==================== 玩家行动（预览版） ====================
async function performAction(intent){
    if(game.gameState!=="free" || game.inExile){ showResultMessage("当前状态无法行动", true); return; }
    if(!intent.trim()) return;
    saveSnapshot();
    lastUserIntent = intent;
    let resultDiv = document.getElementById('freeActionResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<div class="loading-text">⏳ AI思考中，请稍候...</div>`;
    try{
        let promptText = buildPrompt(intent, true, "", []);
        let res = await generateEventPreview(promptText, false);
        if(res){
            pendingActionResult = res;
            showActionResultPreview(res.cleaned);
        } else {
            resultDiv.innerHTML = `<div class="error-text">AI未返回有效结果，请重试。</div><button class="action-sm" onclick="this.parentElement.style.display='none'">关闭</button>`;
            clearPendingAction();
        }
    } catch(e){
        console.error(e);
        resultDiv.innerHTML = `<div class="error-text">执行失败: ${e.message}</div><button class="action-sm" onclick="this.parentElement.style.display='none'">关闭</button>`;
        clearPendingAction();
    }
}
function randomEvent(){ performAction("随机触发宫廷事件，根据当前剧情记忆和局势生成"); }

// ==================== 睡觉功能（增强反馈，完全独立） ====================
async function sleep(){
    if(game.gameState==="prison"){ prisonAction(); return; }
    if(game.gameState==="ghost"){ ghostAction(); return; }

    let resultDiv = document.getElementById('freeActionResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<div class="loading-text">😴 你沉沉睡去，等待梦境中的故事...</div>`;

    advanceDay();
    moveCharactersRandomly();

    try {
        await triggerAutonomousEventWithUI();
        let r = ["做了一个模糊的梦","夜莺在窗外啼鸣","似乎听到走廊脚步声","睡得格外香甜","梦见北境雪原"][Math.floor(Math.random()*5)];
        resultDiv.innerHTML = `<div>✨ ${r}</div><button class="action-sm" onclick="this.parentElement.style.display='none'">关闭</button>`;
    } catch (e) {
        resultDiv.innerHTML = `<div class="error-text">睡眠中发生错误: ${e.message}</div><button class="action-sm" onclick="this.parentElement.style.display='none'">关闭</button>`;
        console.error(e);
    }

    updateUI();
    autoSave();
}

function moveCharactersRandomly(){
    for(let c of characters){
        if(c.name==="理查德" || c.inPrison) continue;
        if(Math.random()<0.25){
            let zoneNames = ["皇宫","野外","王都"];
            let newZone = zoneNames[Math.floor(Math.random()*zoneNames.length)];
            let zoneObj = zones.find(z=>z.name===newZone);
            let newLoc = zoneObj.children[Math.floor(Math.random()*zoneObj.children.length)].id;
            c.zone = newZone; c.location = newLoc;
        }
    }
}
function prisonAction(){
    let a = prompt("地牢中:\n1-越狱\n2-保释(300金)\n3-等待");
    if(a==="1"){ let ch = 0.3+game.intrigue/100; if(Math.random()<ch){ game.escapeAttempts=0; game.gameState="free"; game.currentZone="皇宫"; game.currentLocation="bedroom"; game.inExile=true; game.exileStartYear=game.year; game.exileStartMonth=game.month; showResultMessage("越狱成功，进入神殿修行", false); } else { game.escapeAttempts++; showResultMessage(`越狱失败 ${game.escapeAttempts}/3`, true); } }
    else if(a==="2" && game.gold>=300){ game.gold-=300; game.gameState="free"; game.currentZone="皇宫"; game.currentLocation="bedroom"; showResultMessage("保释出狱", false); }
    updateUI(); renderLocations(); updateLocationDisplay();
}
function ghostAction(){
    let a = prompt("幽灵:\n1-作祟宫廷\n2-托梦情人\n3-轮回");
    if(a==="1"){ game.king.suspicion = Math.min(100,game.king.suspicion+10); showResultMessage("作祟宫廷，国王怀疑+10", false); }
    else if(a==="2"){ let l = characters.find(c=>c.isLover); if(l){ l.affection = Math.min(100,l.affection+10); showResultMessage(`托梦给${l.name}，好感+10`, false); } else showResultMessage("无情人", true); }
    else if(a==="3") resetGame();
    updateUI();
}

// ==================== UI渲染 ====================
function updateUI(){
    document.getElementById('statPrestige').innerText = Math.floor(game.prestige);
    document.getElementById('statIntrigue').innerText = Math.floor(game.intrigue);
    document.getElementById('statGold').innerText = Math.floor(game.gold);
    document.getElementById('kingAffection').innerText = game.king.affection;
    document.getElementById('kingSuspicion').innerText = game.king.suspicion;
    document.getElementById('statLovers').innerText = characters.filter(c=>c.relationship==="lover").length;
    document.getElementById('statConfidants').innerText = characters.filter(c=>c.isConfidant).length;
    let stateText = game.inExile ? "修行" : (game.gameState === "free" ? "自由" : (game.gameState === "prison" ? "囚禁" : "幽灵"));
    document.getElementById('gameState').innerText = stateText;
    updateDateDisplay();
    renderLists(); renderStory();
}
function renderLists(){
    let allDiv = document.getElementById('allCharactersList');
    if(allDiv) allDiv.innerHTML = characters.map(c=>{
        let rankDisplay = (c.name==="理查德") ? "国王" : (c.rankIdx>=0 ? rankTree[c.rankIdx].name : "无");
        return `<div class="person-card" onclick="showPersonModal(${c.id})"><b>${c.name}</b> (${c.type}) <span class="stat-badge">${rankDisplay}</span> ${c.relationship==="lover"?"💕情人":c.relationship==="enemy"?"⚠️仇敌":"🤝结识"}<br>❤️${c.affection} 📍${c.zone}·${c.location}</div>`;
    }).join('');
    let loversDiv = document.getElementById('loversList');
    if(loversDiv) loversDiv.innerHTML = characters.filter(c=>c.relationship==="lover").map(c=>`<div class="person-card" onclick="showPersonModal(${c.id})"><b>${c.name}</b> ❤️${c.affection}</div>`).join('')||"<div>暂无情人</div>";
    let confDiv = document.getElementById('confidantsList');
    if(confDiv){
        confDiv.innerHTML = characters.filter(c=>c.isConfidant).map(c=>`
            <div class="person-card">
                <b>${c.name}</b> ⭐忠诚:${c.loyalty}<br>
                <div>⚔️武艺:${c.combat} 📚智谋:${c.intelligence} 🤝外交:${c.diplomacy}</div>
                <div class="flex-btns">
                    <button class="action-sm" onclick='showTrainDialogById(${c.id})'>📈 深度培养</button>
                    ${canPromote(c) ? `<button class="action-sm" onclick='promoteById(${c.id})'>🏆 晋升</button>` : ''}
                </div>
            </div>
        `).join('')||"<div>无心腹</div>";
    }
}
window.showTrainDialogById = (id) => { let c=characters.find(c=>c.id===id); if(c) showTrainDialog(c); };
window.promoteById = (id) => { let c=characters.find(c=>c.id===id); if(c && promoteRank(c)){ updateUI(); } else showResultMessage("条件不足", true); };
function renderStory(){
    let ctn = document.getElementById('storyContainer');
    if(ctn) ctn.innerHTML = storyMemories.map(s=>`<div style="margin-bottom:0.5rem"><b>${s.time}</b><br>${s.summary}</div>`).join('');
}
function summarizeStory(){ alert(storyMemories.slice(0,10).map(s=>s.summary).join("\n")); }

// ==================== 导出/导入存档 ====================
function exportGame(){
    let saveData = { game, storyMemories, characters, zones, nextId, privateNote };
    let dataStr = JSON.stringify(saveData, null, 2);
    let blob = new Blob([dataStr], {type: "application/json"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `埃瑟兰存档_${game.year}年${game.month}月${game.day}日.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showResultMessage("存档已导出为 JSON 文件", false);
}
function importGame(){
    let input = document.getElementById('importFileInput');
    input.onchange = function(e){
        let file = e.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = function(ev){
            try{
                let saveData = JSON.parse(ev.target.result);
                game = saveData.game;
                storyMemories = saveData.storyMemories || [];
                characters = saveData.characters;
                zones = saveData.zones;
                nextId = saveData.nextId;
                privateNote = saveData.privateNote || "";
                document.getElementById('privateNote').value = privateNote;
                updateUI();
                renderLocations();
                updateLocationDisplay();
                updateLocationDetail();
                showResultMessage("存档导入成功", false);
                autoSave();
            } catch(err){
                showResultMessage("解析存档失败，文件可能损坏", true);
            }
        };
        reader.readAsText(file);
        input.value = '';
    };
    input.click();
}
function resetGame(){
    if(confirm("轮回重置？所有进度将丢失")){
        localStorage.clear();
        location.reload();
    }
}
function saveNote(){ privateNote = document.getElementById('privateNote').value; localStorage.setItem("queen_private_note",privateNote); showResultMessage("笔记已保存", false); }
function loadNote(){ let s = localStorage.getItem("queen_private_note"); if(s){ document.getElementById('privateNote').value=s; privateNote=s; } }
function autoSave(){
    let saveData = { game, storyMemories, characters, zones, nextId, privateNote };
    localStorage.setItem("queen_auto_save", JSON.stringify(saveData));
}
function loadAutoSave(){
    let raw = localStorage.getItem("queen_auto_save");
    if(raw){
        try{
            let s = JSON.parse(raw);
            game = s.game;
            storyMemories = s.storyMemories || [];
            characters = s.characters;
            zones = s.zones;
            nextId = s.nextId;
            privateNote = s.privateNote || "";
            document.getElementById('privateNote').value = privateNote;
            return true;
        }catch(e){}
    }
    return false;
}

function initGame(){
    let app = document.getElementById('appearanceInput').value.trim();
    let idt = document.getElementById('identityInput').value.trim();
    if(!app||!idt){ alert("请填写形象与背景"); return; }
    game.appearance = app; game.identity = idt;
    game.prestige = 60; game.intrigue = 45; game.gold = 200; game.treasury = 100000;
    game.year = 1; game.seasonIndex = 0; game.month = 1; game.day = 1;
    game.gameState = "free"; game.currentZone = "皇宫"; game.currentLocation = "bedroom";
    game.inExile = false; game.escapeAttempts = 0; game.negativePrestigeStartYear = null;
    game.king = { affection:65, suspicion:30 }; game.general = { loyalty:70, ambition:28 };
    storyMemories = []; privateNote = "";
    initCharacters();
    updateUI(); renderLocations(); updateLocationDisplay(); updateLocationDetail();
    document.getElementById('creatorSection').style.display = 'none';
    document.getElementById('gameMainPanel').style.display = 'block';
    loadNote();
    autoSave();
}
function initTabs(){
    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.onclick = ()=>{
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active-pane'));
            document.getElementById(btn.getAttribute('data-tab')).classList.add('active-pane');
        };
    });
}

// 绑定事件
document.getElementById('confirmIdentityBtn').onclick = initGame;
document.getElementById('submitFreeAction').onclick = ()=>performAction(document.getElementById('freeActionInput').value);
document.getElementById('randomEventBtn').onclick = ()=>randomEvent();
document.getElementById('sleepBtn').onclick = ()=>sleep();
document.getElementById('saveApiConfigBtn').onclick = saveApiConfig;
document.getElementById('resetDefaultPromptBtn').onclick = resetDefaultPrompt;
document.getElementById('testApiBtn').onclick = testAPIConnection;
document.getElementById('fetchModelsBtn').onclick = fetchModels;
document.getElementById('exportSaveBtn').onclick = exportGame;
document.getElementById('importSaveBtn').onclick = importGame;
document.getElementById('resetBtn').onclick = resetGame;
document.getElementById('summarizeStoryBtn').onclick = summarizeStory;
document.getElementById('saveNoteBtn').onclick = saveNote;
document.getElementById('dismissAllLoversBtn').onclick = ()=>{ characters.forEach(c=>{ if(c.relationship==="lover"){ c.relationship="acquaintance"; c.isLover=false; } }); updateUI(); showResultMessage("已遣散所有情人", false); };

document.getElementById('confirmAutonomousBtn').onclick = confirmAutonomous;
document.getElementById('cancelAutonomousBtn').onclick = cancelAutonomous;
document.getElementById('regenerateAutonomousBtn').onclick = regenerateAutonomous;
document.getElementById('continueAutonomousBtn').onclick = continueAutonomous;

document.getElementById('confirmInteractionBtn').onclick = confirmInteraction;
document.getElementById('cancelInteractionBtn').onclick = cancelInteraction;
document.getElementById('regenerateInteractionBtn').onclick = regenerateInteraction;
document.getElementById('continueInteractionBtn').onclick = continueInteraction;

window.onload = ()=>{
    loadApiConfig();
    initTabs();
    renderLocations();
    if(loadAutoSave()){
        document.getElementById('creatorSection').style.display = 'none';
        document.getElementById('gameMainPanel').style.display = 'block';
        updateUI();
        renderLocations();
        updateLocationDisplay();
        updateLocationDetail();
        loadNote();
        showResultMessage("已恢复上次游戏进度", false);
    } else {
        document.getElementById('creatorSection').style.display = 'block';
        document.getElementById('gameMainPanel').style.display = 'none';
    }
};
</script>
</body>
</html>
